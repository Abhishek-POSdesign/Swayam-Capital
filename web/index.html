<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swayam Capital — Options Trading Platform</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      const params = new URLSearchParams(window.location.search);
      const qpTheme = params.get('theme');
      if (qpTheme && ['light', 'dark', 'auto'].includes(qpTheme)) {
        document.documentElement.setAttribute('data-theme', qpTheme);
        try { localStorage.setItem('swayam-theme', qpTheme); } catch (_) {}
      } else {
        const stored = localStorage.getItem('swayam-theme');
        if (stored) document.documentElement.setAttribute('data-theme', stored);
      }
      if (params.get('ai') === 'open') {
        document.documentElement.classList.add('ai-panel-open');
      }

      document.addEventListener('DOMContentLoaded', () => {
        const path = window.location.pathname;
        const qpPage = params.get('page');
        const page = qpPage ? qpPage
                   : path.includes('/strategy') ? 'strategy'
                   : path.includes('/journal')  ? 'journal'
                   : 'home';
        ['home', 'strategy', 'journal'].forEach(p => {
          const el = document.getElementById(p + '-view');
          if (el) el.style.display = (p === page) ? 'block' : 'none';
        });
        if (params.get('ai') === 'open') {
          document.body.classList.add('ai-panel-open');
          const drawer = document.getElementById('ai-sidebar-container');
          if (drawer) drawer.style.right = '0px';
        }
      });
    </script>
  </head>
  <body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Home Page View (BUILD-9 Default) -->
    <div id="home-view">
      <div class="skeleton-layout" style="padding: 16px 24px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">
        <div class="skeleton-block" style="height: 120px; width: 100%;"></div>
        <div class="skeleton-block" style="height: 220px; width: 100%;"></div>
        <div class="skeleton-block" style="height: 280px; width: 100%;"></div>
      </div>
    </div>

    <!-- Strategy Builder View (Multi-page navigation, BUILD-10) -->
    <div id="strategy-view" style="display: none;">
      <div class="skeleton-layout" style="padding: 16px 24px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">
        <div class="skeleton-block" style="height: 48px; width: 100%;"></div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div class="skeleton-block" style="height: 80px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 80px; width: 100%;"></div>
        </div>
        <div class="skeleton-block" style="height: 420px; width: 100%;"></div>
      </div>
    </div>

    <!-- Trade Journal & Analytics View (BUILD-11) -->
    <div id="journal-view" style="display: none;">
      <div class="skeleton-layout" style="padding: 14px 24px; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;">
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
        </div>
        <div class="skeleton-block" style="height: 52px; width: 100%;"></div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- Persistent AI Trading Partner Sidebar Drawer -->
    <aside class="ai-sidebar-drawer" id="ai-sidebar-container" style="position: fixed; right: -450px; top: 0; bottom: 0; width: 400px; max-width: 92vw; z-index: 1000; background: var(--dl-card, #191b21); border-left: 2px solid var(--accent-lilac, #ac9fd2); transition: right 0.25s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: -10px 0 30px rgba(0,0,0,0.5);">
      <div class="ai-panel" id="ai-panel">
        <div class="ai-panel__header">
          <div class="ai-panel__header-left">
            <div class="ai-orb" style="width: 24px; height: 24px; border-radius: 50%; background: var(--accent-lilac-tint); color: var(--accent-lilac); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;">✦</div>
            <span class="ai-panel__title" style="font-family: var(--font-sans); font-size: 0.92rem; font-weight: 600; color: var(--dl-fg);">Trading Partner</span>
            <span class="ai-panel__conv-title" id="ai-conv-title"></span>
          </div>
          <div class="ai-panel__header-right">
            <button class="ai-btn ai-btn--sm" id="ai-btn-new" title="New conversation">+ New</button>
            <button class="ai-btn ai-btn--sm" id="ai-btn-history" title="Conversation history">History</button>
            <button class="ai-btn ai-btn--ghost" id="ai-btn-collapse" title="Collapse">❯</button>
          </div>
        </div>

        <div class="ai-panel__body" id="ai-panel-body">
          <div class="ai-messages" id="ai-messages"></div>
          <div class="ai-starters" id="ai-starters">
            <p class="ai-starters__label">Ask me something to start:</p>
            <button class="ai-starter-btn">Walk me through today's market open — what's setting up?</button>
            <button class="ai-starter-btn">Given India VIX is at the 8th percentile, what setups favor this regime?</button>
            <button class="ai-starter-btn">Anything on the calendar this week I should NOT trade around?</button>
            <button class="ai-starter-btn">Based on my last 5 trades, what mistake am I repeating?</button>
          </div>
          <div class="ai-error" id="ai-error" style="display:none;"></div>
        </div>

        <div class="ai-panel__input-area" id="ai-input-area">
          <textarea class="ai-textarea" id="ai-textarea" rows="2" placeholder="Ask anything about this trade, regime, or your method..."></textarea>
          <button class="ai-btn ai-btn--primary" id="ai-btn-send">Send</button>
        </div>

        <div class="ai-panel__footer" id="ai-footer">
          <span id="ai-cost-display">Today's AI spend: ₹0.00 (0 requests)</span>
        </div>
      </div>
    </aside>

    <!-- AI Voice & Memory Settings Drawer Container -->
    <div id="ai-settings-drawer-container"></div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal-overlay">
      <div class="modal-content">
        <h3 style="margin-bottom: 1rem; color: var(--accent-lilac);">Confirm Paper Execution</h3>
        <p style="margin-bottom: 0.75rem; color: var(--text-primary);">
          Are you sure you want to execute this paper trade?
        </p>
        <div style="background-color: var(--bg-elevated); padding: 1rem; border-radius: 6px; border: 1px solid var(--border); font-size: 0.875rem;" class="mono">
          <div>Strategy: <strong id="modal-strategy-name" style="color: var(--text-primary);">-</strong></div>
          <div>Max Loss: <span id="modal-max-loss" style="color: var(--red);">-</span></div>
          <div>Max Profit: <span id="modal-max-profit" style="color: var(--green);">-</span></div>
          <div>R:R Ratio: <span id="modal-rr" style="color: var(--amber);">-</span></div>
        </div>
        <div class="modal-actions">
          <button id="modal-btn-cancel">Cancel</button>
          <button id="modal-btn-confirm" class="primary">Confirm & Execute</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
