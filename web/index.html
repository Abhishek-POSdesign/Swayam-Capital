<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#86ab92" />
    <title>Swayam Capital — Options Trading Platform</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swayam" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Noto+Sans+Devanagari:wght@500;600&display=swap" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      const params = new URLSearchParams(window.location.search);
      const qpTheme = params.get('theme');
      if (qpTheme && ['light', 'dark', 'auto'].includes(qpTheme)) {
        document.documentElement.setAttribute('data-theme', qpTheme);
        try { localStorage.setItem('swayam-theme', qpTheme); } catch (_) {}
      } else {
        const stored = localStorage.getItem('swayam-theme');
        if (stored) document.documentElement.setAttribute('data-theme', stored);
      }
      // ?ai=open only records the wish. The panel is opened by main.js once
      // its frame exists, because opening it is a position and a size, not a
      // class on the page. BUILD_07: nothing here may add a class that moves
      // the page, and `ai-panel-open` no longer exists anywhere.
      if (params.get('ai') === 'open') {
        window.__swayamOpenAIPanel = true;
      }

      document.addEventListener('DOMContentLoaded', () => {
        const path = window.location.pathname;
        const qpPage = params.get('page');
        const page = qpPage ? qpPage
                   : path.includes('/strategy') ? 'strategy'
                   : path.includes('/journal')  ? 'journal'
                   : 'home';
        ['home', 'strategy', 'journal'].forEach(p => {
          const el = document.getElementById(p + '-view');
          if (el) el.style.display = (p === page) ? 'block' : 'none';
        });
      });
    </script>
  </head>
  <body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Home Page View (BUILD-9 Default) -->
    <div id="home-view">
      <div class="skeleton-layout" style="padding: 16px 24px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">
        <div class="skeleton-block" style="height: 120px; width: 100%;"></div>
        <div class="skeleton-block" style="height: 220px; width: 100%;"></div>
        <div class="skeleton-block" style="height: 280px; width: 100%;"></div>
      </div>
    </div>

    <!-- Strategy Builder View (Multi-page navigation, BUILD-10) -->
    <div id="strategy-view" style="display: none;">
      <div class="skeleton-layout" style="padding: 16px 24px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">
        <div class="skeleton-block" style="height: 48px; width: 100%;"></div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div class="skeleton-block" style="height: 80px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 80px; width: 100%;"></div>
        </div>
        <div class="skeleton-block" style="height: 420px; width: 100%;"></div>
      </div>
    </div>

    <!-- Trade Journal & Analytics View (BUILD-11) -->
    <div id="journal-view" style="display: none;">
      <div class="skeleton-layout" style="padding: 14px 24px; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;">
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
          <div class="skeleton-block" style="height: 88px;"></div>
        </div>
        <div class="skeleton-block" style="height: 52px; width: 100%;"></div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-block" style="height: 38px; width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- THE FLOATING AI PANEL. BUILD_07.
         It is `position: fixed` and the page behind it NEVER reflows. Narrowing
         the page was measured, offered to him and rejected: see
         web/src/components/ai-panel-frame.js.
         It is pinned below both order tickets in CSS. Nothing sits on top of an
         exit ticket.
         Its insides are rendered by ai-chat.js when the app starts, so only the
         shell lives here. That is also why there is no starter prompt in this
         file to flash on load: there are none, anywhere, in any state. -->
    <aside class="ai-float-panel"
           id="ai-sidebar-container"
           aria-label="AI Trading Partner"
           aria-hidden="true"
           hidden></aside>

    <!-- AI Voice & Memory Settings Drawer Container -->
    <div id="ai-settings-drawer-container"></div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal-overlay">
      <div class="modal-content">
        <h3 style="margin-bottom: 1rem; color: var(--accent-sage);">Confirm Paper Execution</h3>
        <p style="margin-bottom: 0.75rem; color: var(--text-primary);">
          Are you sure you want to execute this paper trade?
        </p>
        <div style="background-color: var(--bg-elevated); padding: 1rem; border-radius: 6px; border: 1px solid var(--border); font-size: 0.875rem;" class="mono">
          <div>Strategy: <strong id="modal-strategy-name" style="color: var(--text-primary);">-</strong></div>
          <div>Max Loss: <span id="modal-max-loss" style="color: var(--red);">-</span></div>
          <div>Max Profit: <span id="modal-max-profit" style="color: var(--green);">-</span></div>
          <div>R:R Ratio: <span id="modal-rr" style="color: var(--amber);">-</span></div>
        </div>
        <div class="modal-actions">
          <button id="modal-btn-cancel">Cancel</button>
          <button id="modal-btn-confirm" class="primary">Confirm & Execute</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
