[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swayam-capital"
version = "0.3.0"
description = "Swayam Capital: Rule-enforced options trading platform"
readme = "README.md"
authors = [{ name = "Abhishek Sikka" }]
requires-python = ">=3.11"
dependencies = [
    "py_vollib_vectorized>=0.1.1",
    "vollib>=1.0.11",
    "fyers-apiv3>=3.1.7",
    "supabase>=2.7.4",
    "duckdb>=1.1.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "websocket-client>=1.8.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-cloud-storage>=2.18.2",
    "google-cloud-secret-manager>=2.20.2",
    "pytz>=2024.1",
    "google-genai>=1.0.0",
    "gunicorn>=23.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
