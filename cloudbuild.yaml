steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/swayam/dashboard:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/swayam/dashboard:latest'
      - '.'
    timeout: 900s

  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'asia-south1-docker.pkg.dev/$PROJECT_ID/swayam/dashboard']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'swayam-dashboard'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/swayam/dashboard:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--service-account=swayam-dashboard-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--no-allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=60s'
      - '--concurrency=40'
      - '--set-env-vars=GCP_PROJECT_ID=swayam-capital,GCP_REGION=asia-south1,GCP_AI_LOCATION=global,GCS_OPTIONS_BUCKET=swayam-capital-options-data'
      - '--set-secrets=SUPABASE_URL=swayam-supabase-url:latest,SUPABASE_ANON_KEY=swayam-supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=swayam-supabase-service-role-key:latest,FYERS_ACCESS_TOKEN=fyers-access-token:latest,FYERS_CLIENT_ID=fyers-client-id:latest,FYERS_APP_ID=fyers-app-id:latest,FYERS_SECRET_KEY=fyers-secret-key:latest'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/swayam/dashboard:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/swayam/dashboard:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
